<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-en" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#ff5a00"/>
    </marker>
    <filter id="shadow-en" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3a0d0d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #3a0d0d; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #3a0d0d; opacity: 0.75; }
      .label { font: 700 23px Arial, Helvetica, sans-serif; fill: #3a0d0d; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #3a0d0d; opacity: 0.72; }
      .formula { font: 700 26px Arial, Helvetica, sans-serif; fill: #ff5a00; }
      .rod-label { font: 700 18px Arial, Helvetica, sans-serif; fill: #3a0d0d; opacity: 0.65; }
      .arrow { stroke: #ff5a00; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-en); }
      .bead-active { fill: #ff5a00; stroke: #8f3d18; stroke-width: 4; }
      .bead-idle { fill: #f8e2c0; stroke: #8f3d18; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#fff6f1"/>
  <rect x="52" y="46" width="1296" height="808" rx="24" fill="white" stroke="#d8c8bb" stroke-width="3"/>

  <text x="92" y="108" class="title">How a Soroban Works</text>
  <text x="92" y="146" class="subtitle">Each rod represents one decimal place. The middle bar separates active and inactive beads.</text>

  <g filter="url(#shadow-en)">
    <rect x="360" y="185" width="680" height="530" rx="14" fill="#f5c58a" stroke="#7b3f21" stroke-width="18"/>
    <rect x="385" y="401" width="630" height="34" rx="8" fill="#7b3f21"/>

    <g stroke="#7b3f21" stroke-width="8" stroke-linecap="round">
      <line x1="455" y1="210" x2="455" y2="688"/>
      <line x1="535" y1="210" x2="535" y2="688"/>
      <line x1="615" y1="210" x2="615" y2="688"/>
      <line x1="695" y1="210" x2="695" y2="688"/>
      <line x1="775" y1="210" x2="775" y2="688"/>
      <line x1="855" y1="210" x2="855" y2="688"/>
      <line x1="935" y1="210" x2="935" y2="688"/>
    </g>

    <g>
      <rect class="bead-idle" x="431" y="260" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="511" y="260" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="591" y="260" width="48" height="28" rx="14"/>
      <rect class="bead-active" x="671" y="360" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="751" y="260" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="831" y="260" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="911" y="260" width="48" height="28" rx="14"/>
    </g>

    <g>
      <rect class="bead-idle" x="431" y="511" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="431" y="557" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="431" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="431" y="649" width="48" height="28" rx="14"/>

      <rect class="bead-idle" x="511" y="511" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="511" y="557" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="511" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="511" y="649" width="48" height="28" rx="14"/>

      <rect class="bead-idle" x="591" y="511" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="591" y="557" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="591" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="591" y="649" width="48" height="28" rx="14"/>

      <rect class="bead-active" x="671" y="454" width="48" height="28" rx="14"/>
      <rect class="bead-active" x="671" y="490" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="671" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="671" y="649" width="48" height="28" rx="14"/>

      <rect class="bead-idle" x="751" y="511" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="751" y="557" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="751" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="751" y="649" width="48" height="28" rx="14"/>

      <rect class="bead-idle" x="831" y="511" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="831" y="557" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="831" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="831" y="649" width="48" height="28" rx="14"/>

      <rect class="bead-idle" x="911" y="511" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="911" y="557" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="911" y="603" width="48" height="28" rx="14"/>
      <rect class="bead-idle" x="911" y="649" width="48" height="28" rx="14"/>
    </g>

    <g fill="white" stroke="#7b3f21" stroke-width="3">
      <circle cx="535" cy="418" r="13"/>
      <circle cx="695" cy="418" r="13"/>
      <circle cx="855" cy="418" r="13"/>
    </g>
  </g>

  <g>
    <rect x="86" y="210" width="260" height="118" rx="12" fill="#fffaf7" stroke="#d8c8bb" stroke-width="2"/>
    <text x="110" y="248" class="label">Upper beads</text>
    <text x="110" y="287" class="formula">5 x 10^n</text>
    <text x="110" y="314" class="small">One bead is worth five units</text>
    <path class="arrow" d="M348 268 C392 258 408 266 432 278"/>
  </g>

  <g>
    <rect x="88" y="542" width="270" height="128" rx="12" fill="#fffaf7" stroke="#d8c8bb" stroke-width="2"/>
    <text x="112" y="580" class="label">Lower beads</text>
    <text x="112" y="619" class="formula">1,...,4 x 10^n</text>
    <text x="112" y="646" class="small">Each bead adds one unit</text>
    <path class="arrow" d="M360 606 C390 586 408 563 432 526"/>
  </g>

  <g>
    <rect x="1046" y="230" width="270" height="128" rx="12" fill="#fffaf7" stroke="#d8c8bb" stroke-width="2"/>
    <text x="1070" y="268" class="label">Decimal rod</text>
    <text x="1070" y="306" class="small">The exponent n changes with</text>
    <text x="1070" y="333" class="small">the rod position.</text>
    <path class="arrow" d="M1046 315 C1000 333 968 365 936 402"/>
  </g>

  <g>
    <rect x="1048" y="428" width="270" height="142" rx="12" fill="#fffaf7" stroke="#d8c8bb" stroke-width="2"/>
    <text x="1072" y="466" class="label">Middle bar</text>
    <text x="1072" y="503" class="small">Beads touching this bar are</text>
    <text x="1072" y="530" class="small">the beads being counted.</text>
    <path class="arrow" d="M1048 500 C1015 479 998 449 968 424"/>
  </g>

  <g>
    <rect x="1048" y="616" width="270" height="142" rx="12" fill="#fffaf7" stroke="#d8c8bb" stroke-width="2"/>
    <text x="1072" y="654" class="label">Unit point</text>
    <text x="1072" y="691" class="small">When the point is on the bar,</text>
    <text x="1072" y="718" class="small">that rod can be used as the</text>
    <text x="1072" y="745" class="small">unit place: 10^0.</text>
    <path class="arrow" d="M1048 690 C980 650 918 525 858 431"/>
  </g>

  <g>
    <text x="518" y="754" class="rod-label">10^2</text>
    <text x="678" y="754" class="rod-label">10^0 unit</text>
    <text x="838" y="754" class="rod-label">10^-2</text>
    <path d="M695 731 L695 439" stroke="#ff5a00" stroke-width="3" stroke-dasharray="8 8"/>
  </g>
</svg>
